name: Daily news ingestion

on:
  schedule:
    # GitHub cron is best-effort and can be delayed or occasionally dropped.
    # Use off-peak minutes plus an idempotent fallback. Times are UTC:
    # 22:17 UTC = 03:47 IST; 23:07 UTC = 04:37 IST (following IST day).
    - cron: "17 22 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional IST publication date (YYYY-MM-DD)"
        required: false
        type: string

concurrency:
  group: production-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      PERPLEXITY_MODEL: sonar
      NEWS_ENABLED_SOURCES: pib,times_of_india_top,times_of_india_india
      NEWS_USER_AGENT: UPSCNewsFetcher/1.0
      NEWS_API_BASE_URL: https://news-fetcher-oav3.onrender.com
      CONSOLIDATION_MODEL: sonar
      TARGET_DATE: ${{ inputs.date }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing GitHub secret: DATABASE_URL"; exit 1; }
          test -n "$PERPLEXITY_API_KEY" || { echo "Missing GitHub secret: PERPLEXITY_API_KEY"; exit 1; }

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, hydrate, and store daily news
        shell: bash
        run: |
          args=(--enqueue-daily --hydrate-missing-pib --drain)
          if [ -n "$TARGET_DATE" ]; then
            args+=(--date "$TARGET_DATE")
          fi
          python queue_worker.py "${args[@]}"

      - name: Show pipeline status on failure
        if: failure()
        run: |
          echo "The ingestion failed or retained retryable work. Review this run's logs."
          echo "No data is discarded: jobs and missing PIB content remain in PostgreSQL for the next run."
